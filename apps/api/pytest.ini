[pytest]
DJANGO_SETTINGS_MODULE = plane.settings.test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests for models, serializers, and utility functions
    contract: Contract tests for API endpoints
    smoke: Smoke tests for critical functionality
    slow: Tests that are slow and might be skipped in some contexts
    migration_replay: literal 0127->0128 migration replay; requires --migrations, deselected from the default --nomigrations run

addopts = 
    --strict-markers
    --reuse-db
    --nomigrations
    -m "not migration_replay"
    -vs 